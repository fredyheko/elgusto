<!DOCTYPE html>
<html lang="{{LANG}}" data-base="{{B}}">
<head>
{{HEAD}}
</head>
<body data-v="1">
<div class="closed" id="closedBar"></div>
<header>
  <a class="brand" href="{{HOME}}" aria-label="L'Gusto"><img class="blogo" src="{{B}}img/logo.webp" alt="L'Gusto express food" width="640" height="265"></a>
  <div class="hr">
    <nav class="lang" aria-label="Limba / Язык"><a id="l-ro" href="{{RO_HREF}}" hreflang="ro" lang="ro">RO</a><a id="l-ru" href="{{RU_HREF}}" hreflang="ru" lang="ru">RU</a></nav>
    <a class="call" id="callBtn" href="tel:+37360465059" aria-label="{{CALL_LABEL}}">📞</a>
  </div>
</header>

<section class="hero">
  <div>
    <h1 data-i="h1"></h1>
    <p data-i="lead"></p>
    <div class="badges"><div data-i="b1"></div><div data-i="b2"></div><div data-i="b3"></div></div>
    <button class="cta" onclick="go(CATS[0].id)" data-i="see"></button><a class="cta ghost" href="#contacte" data-i="contacts"></a>
  </div>
  <div class="collage" id="collage"></div>
</section>
<div class="tickwrap" aria-hidden="true"><div class="ticker"><div class="tk" id="ticker"></div></div></div>

<div class="block">
  <h2 data-i="rec"></h2>
  <div class="pop" id="pop"></div>
</div>

<div class="search"><input id="q" type="search" oninput="filter()" aria-label="search"></div>

<nav class="tabs" id="tabs"></nav>
<main id="menu"></main><div class="empty" id="empty" data-i="empty"></div>

<div class="block">
  <h2 data-i="how"></h2>
  <div class="steps">
    <div><b data-i="s1t"></b><p data-i="s1p"></p></div>
    <div><b data-i="s2t"></b><p data-i="s2p"></p></div>
    <div><b data-i="s3t"></b><p data-i="s3p"></p></div>
  </div>
  <h2 id="contacte" data-i="info"></h2>
  <div class="info">
    <div id="i1"></div>
    <div id="i2"></div>
    <div id="i3"></div>
  </div>
  <div class="note" data-i="alg"></div>
</div>
<footer><div class="soc" id="soc"></div><span id="foot"></span>
  <div class="credit">Site: <a href="#" rel="nofollow">Nodo</a></div></footer>

<div class="addon" id="addon"></div>
<button class="lastord" id="lastord"></button>
<button class="cartbtn" id="cartbtn" onclick="openCart()"></button>

<div class="ov" id="ov" onclick="if(event.target===this)closeAll()">
  <div class="sheet" id="sheet"></div>
</div>

<!--NOSCRIPT-->

 needMore:(x)=>`Добавьте ещё ${x} лей — и доставка по городу будет бесплатной. Для заказов до ${D.city.freeFrom} лей доставка ${D.city.feeBelow == null ? "платная — точную стоимость доставки сообщит оператор" : "стоит " + D.city.feeBelow + " лей"}.`,

let cart = {}, mode = "delivery", zone = "city", pay = "cash", L = PAGE_L, settings = { open: true, stop: [] }, sending = false;
try { cart = JSON.parse(localStorage.getItem("lg-cart") || "{}"); Object.keys(cart).forEach((k) => { if (!BY[k]) delete cart[k]; }); } catch (e) { cart = {}; }
const t = (k) => T[L][k];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const saveCart = () => { try { localStorage.setItem("lg-cart", JSON.stringify(cart)); } catch (e) {} };
const avail = (id) => !(settings.stop || []).includes(id);

/* ---------- время работы (по Кишинёву) ---------- */
function isOpenNow() {
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Chisinau", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
  const wd = { Mon: 0, Tue: 1, Wed: 2, Thu: 3, Fri: 4, Sat: 5, Sun: 6 }[p.find((x) => x.type === "weekday").value];
  const mins = +p.find((x) => x.type === "hour").value % 24 * 60 + +p.find((x) => x.type === "minute").value;
  const h = R.hours[wd]; if (!h) return false;
  const [o, c] = h.map((s) => { const [a, b] = s.split(":"); return +a * 60 + +b; });
  return mins >= o && mins < c;
}
const canOrder = () => settings.open && isOpenNow();
function updClosed() {
  const b = $("closedBar"), ok = canOrder();
  b.classList.toggle("show", !ok);
  if (!ok) b.innerHTML = `${settings.open ? t("closedNow") : t("paused")}<a href="tel:${tel}" style="color:#fff;font-weight:800">${R.phone}</a>`;
  setTimeout(fixSticky, 0);
}

/* ---------- язык ---------- */
window.setLang = function (l) {
  if (l !== PAGE_L) { keepDraft(); location.href = l === "ru" ? BASE + "ru/" : (BASE || "./"); return; }
  L = l;
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach((el) => (el.innerHTML = t(el.dataset.i)));
  ["i1", "i2", "i3"].forEach((k) => ($(k).innerHTML = t(k)));
  $("q").placeholder = t("search");
  $("l-ro").classList.toggle("on", l === "ro"); $("l-ru").classList.toggle("on", l === "ru");
  $("foot").innerHTML = `<b>L'Gusto express food</b><br>${R.address[l]}<br><a href="tel:${tel}">${R.phone}</a>`;
  render(); extras(); filter(); upd(); updClosed(); updLast(); fillTicker();
  if ($("ov").classList.contains("show")) { if (trackId) openTrack(trackId); else if (count()) openCart(); }
};

/* ---------- меню ---------- */
function cardHtml(m, hit) {
  const ok = avail(m.id), ing = L === "ru" ? m.ru : m.ro;
  return `<div class="card${ok ? "" : " na"}">${ok ? "" : `<span class="na-tag">${t("na")}</span>`}
  <div class="pic">${m.img ? `<img src="${BASE}${m.img}" alt="${esc(m.name)}" width="480" height="360" loading="lazy" decoding="async">` : `<span class="pe">${(ALLCATS.find((c) => c.id === m.cat) || {}).icon || "🍽️"}</span>`}</div>
  <div class="body"><h3>${esc(dname(m))}</h3><div class="ing">${esc(ing)}</div>
  <div class="row"><span class="gr">${m.g ? gShow(m.g) + " " + (L === "ru" ? "г" : "g") : ""}</span><span class="pr">${m.price} <small>${t("cur")}</small></span><button class="qbtn" aria-label="${t("add")}" onclick="add('${m.id}',this)">+</button></div>
  <button class="add" onclick="add('${m.id}',this)">${t("add")}</button></div></div>`;
}
function render() {
  $("tabs").innerHTML = CATS.map((c, i) => `<button class="tab${i ? "" : " on"}" onclick="go('${c.id}')">${c.icon} ${t("cats")[c.id]}</button>`).join("");
  $("menu").innerHTML = CATS.map((c) => `<section class="sec" id="s-${c.id}"><h2>${t("cats")[c.id]}</h2><div class="grid">${MENU.filter((m) => m.cat === c.id).map((m) => cardHtml(m, 0)).join("")}</div></section>`).join("");
}
function extras() {
  const withImg = MENU.filter((m) => m.img);
  const pick = ["double-cheeseburger-lgusto", "kebab-lgusto", "aripi-asiatic"].map((id) => BY[id]).filter(Boolean);
  const col = pick.length === 3 ? pick : withImg.slice(0, 3);
  const heroName = L === "ru" ? "Бургер с хрустящей курицей" : "Burger cu pui crocant", heroPrice = 75;
  $("collage").innerHTML = `<img src="${BASE}img/hero-burger.webp" alt="${heroName}" fetchpriority="high" width="693" height="564"><div class="sticker" aria-label="${heroName}: ${heroPrice} ${t("cur")}"><b>${heroPrice}</b><span>${t("cur")}</span></div>`;
  // «Рекомендуем»: список задаёт оператор (settings.rec); null — список по умолчанию из config.js
  const recIds = (Array.isArray(settings.rec) ? settings.rec : (window.RECOMMENDED_DEFAULT || [])).filter((id) => BY[id] && avail(id));
  $("pop").innerHTML = recIds.map((id) => cardHtml(BY[id], 1)).join("");
  $("pop").parentElement.style.display = recIds.length ? "" : "none";
}
window.filter = function () {
  const v = $("q").value.trim().toLowerCase(); let any = 0;
  document.querySelectorAll("#menu .sec").forEach((sec) => { let n = 0; sec.querySelectorAll(".card").forEach((c) => { const ok = !v || c.textContent.toLowerCase().includes(v); c.style.display = ok ? "" : "none"; if (ok) n++; }); sec.style.display = n ? "" : "none"; if (n) any = 1; });
  $("empty").style.display = any ? "none" : "block";
};
const hdrH = () => document.querySelector("header").offsetHeight + ($("closedBar").classList.contains("show") && scrollY < 5 ? 0 : 0);
function fixSticky() { $("tabs").style.top = document.querySelector("header").offsetHeight + "px"; }
window.go = function (id) { const el = $("s-" + id); if (!el) return; scrollTo({ top: el.getBoundingClientRect().top + scrollY - hdrH() - $("tabs").offsetHeight - 8, behavior: "smooth" }); };
let tick = 0;
addEventListener("scroll", () => { if (tick) return; tick = 1; requestAnimationFrame(() => { tick = 0;
  const lim = hdrH() + $("tabs").offsetHeight + 20; let cur = CATS[0].id;
  CATS.forEach((c) => { const el = $("s-" + c.id); if (el && el.getBoundingClientRect().top <= lim) cur = c.id; });
  document.querySelectorAll(".tab").forEach((b, i) => { const on = CATS[i].id === cur; if (on && !b.classList.contains("on")) { b.classList.add("on"); $("tabs").scrollTo({ left: b.offsetLeft - $("tabs").clientWidth / 2 + b.offsetWidth / 2, behavior: "smooth" }); } else if (!on) b.classList.remove("on"); }); }); }, { passive: true });
addEventListener("resize", fixSticky);

/* ---------- корзина ---------- */
function flyToCart(b) {
  try {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const card = b.closest(".card"), img = card && card.querySelector(".pic img"); if (!img) return;
    const r = img.getBoundingClientRect(), cb = $("cartbtn"); const shown = cb.style.display === "block";
    const tr = shown ? cb.getBoundingClientRect() : { left: innerWidth / 2 - 30, top: innerHeight - 70, width: 60, height: 40 };
    const c = img.cloneNode(); c.className = "flyer";
    Object.assign(c.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
    document.body.appendChild(c);
    const dx = tr.left + tr.width / 2 - (r.left + r.width / 2), dy = tr.top + tr.height / 2 - (r.top + r.height / 2);
    c.animate([{ transform: "translate(0,0) scale(1) rotate(0)", opacity: 1 },
      { transform: `translate(${dx * .5}px,${dy * .5 - 80}px) scale(.7) rotate(-12deg)`, opacity: 1, offset: .55 },
      { transform: `translate(${dx}px,${dy}px) scale(.15) rotate(10deg)`, opacity: .2 }],
      { duration: 650, easing: "cubic-bezier(.5,0,.6,1)" }).onfinish = () => { c.remove(); cb.classList.remove("bump"); void cb.offsetWidth; cb.classList.add("bump"); };
  } catch (e) {}
}
window.add = function (k, b) {
  if (!avail(k)) return;
  flyToCart(b);
  cart[k] = (cart[k] || 0) + 1; saveCart();
  const r = b.classList.contains("qbtn"); b.textContent = r ? "✓" : t("added"); b.classList.add("done");
  if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
  setTimeout(() => { b.textContent = r ? "+" : t("add"); b.classList.remove("done"); }, 900); upd();
  offerAddons(k);
};
window.chg = function (k, d) { cart[k] += d; if (cart[k] <= 0) delete cart[k]; saveCart(); upd(); if (count()) openCart(); else closeAll(); };
const sub = () => Object.entries(cart).reduce((s, [k, q]) => s + BY[k].price * q, 0);
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
function fee() { if (mode !== "delivery") return 0; if (zone === "other") return D.other.feeFrom; return sub() >= D.city.freeFrom ? 0 : (D.city.feeBelow || 0); }
const feeOpen = () => mode === "delivery" && (zone === "other" || (sub() < D.city.freeFrom && D.city.feeBelow == null));
function upd() { const c = count(); $("cartbtn").style.display = c ? "block" : "none"; $("cartbtn").textContent = `${t("cart")} (${c}): ${sub()} ${t("cur")}`; updLast(); }
/* ---------- соусы и добавки ---------- */
const cap = (x) => x ? x[0].toUpperCase() + x.slice(1) : x;
// "840/100/50/30" (сет: суши/имбирь/васаби/соус) → показываем только вес суши
function gShow(g) { const p = String(g).split("/"); return p.length > 2 ? p[0] : g; }
function dname(m) {
  if (L === "ru" && m.cat === "sosuri") return cap(m.ru);
  return L === "ru" ? m.name.replace(/ buc\.\)/, " шт.)") : m.name;
}
function shortName(m) { return cap(dname(m).replace(/^(Adaos kebab: |Добавка в кебаб: )/, "")); }
const offered = new Set();
const XICON = { "adaos-pui": "🍗", "adaos-porc-vita": "🥩", "adaos-cascaval": "🧀", "adaos-sos": "🥫" };
function chipHtml(id) {
  const m = BY[id]; if (!m || !avail(id)) return "";
  const q = cart[id] || 0;
  return `<div class="chip${q ? " in" : ""}">${m.img ? `<img src="${BASE}${m.img}" alt="" width="52" height="40">` : `<span class="ce">${XICON[id] || "➕"}</span>`}
   <div class="cn"><b>${esc(shortName(m))}</b><span>${m.price} ${t("cur")}</span></div>
   ${q ? `<div class="cq"><button onclick="adChg('${id}',-1)" aria-label="−">−</button><b>${q}</b><button onclick="adChg('${id}',1)" aria-label="+">+</button></div>`
       : `<button class="cadd" onclick="adChg('${id}',1)" aria-label="${t("add")}">+</button>`}</div>`;
}
function groupsFor(cat) { return ((AD.offer || {})[cat] || []).filter((g) => (AD[g] || []).some((id) => BY[id] && avail(id))); }
let adFor = null;
function drawAddon() {
  const m = BY[adFor]; const gs = groupsFor(m.cat);
  $("addon").innerHTML = `<div class="adbox" role="dialog" aria-modal="true" aria-labelledby="adh">
    <h3 id="adh">${esc(t(gs.includes("kebabExtras") ? "adTK" : "adT")(dname(m)))}</h3>
    ${gs.map((g) => `<p class="adg">${g === "sauces" ? t("adSauces") : t("adExtras")}</p><div class="chips">${AD[g].map(chipHtml).join("")}</div>`).join("")}
    <div class="adact"><button class="adno" onclick="closeAddon()">${t("adNo")}</button><button class="big" onclick="closeAddon()">${t("adDone")}</button></div></div>`;
}
function offerAddons(k) {
  const m = BY[k]; if (!m || offered.has(k) || !groupsFor(m.cat).length) return;
  offered.add(k); adFor = k;
  setTimeout(() => { drawAddon(); $("addon").classList.add("show"); }, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 450);
}
window.closeAddon = () => $("addon").classList.remove("show");
window.adChg = function (id, d) {
  cart[id] = (cart[id] || 0) + d; if (cart[id] <= 0) delete cart[id]; saveCart(); upd();
  if ($("addon").classList.contains("show")) drawAddon();
  if ($("ov").classList.contains("show") && !trackId) openCart();
};
$("addon").addEventListener("click", (e) => { if (e.target.id === "addon") closeAddon(); });
addEventListener("keydown", (e) => { if (e.key === "Escape") closeAddon(); });
function cartSauces() {
  const need = Object.keys(cart).some((k) => BY[k] && groupsFor(BY[k].cat).includes("sauces"));
  if (!need) return "";
  return `<p class="adg">${t("adCart")}</p><div class="chips row">${AD.sauces.map(chipHtml).join("")}</div>`;
}
function lines() {
  return Object.entries(cart).map(([k, q]) => { const m = BY[k]; return `<div class="ci">${m.img ? `<img src="${BASE}${m.img}" alt="" width="58" height="44" style="width:58px;height:44px;object-fit:contain">` : ""}<div class="n">${esc(dname(m))}${avail(k) ? "" : ` <span style="color:#ff8080">· ${t("na")}</span>`}<small>${m.price} ${t("cur")}${m.g ? " · " + gShow(m.g) + " " + (L === "ru" ? "г" : "g") : ""}</small></div>
  <div class="q"><button onclick="chg('${k}',-1)">−</button><b>${q}</b><button onclick="chg('${k}',1)">+</button></div></div>`; }).join("");
}
let draft = { n: "", p: "", a: "", c: "" };
function keepDraft() { ["fn", "fp", "fa", "fc"].forEach((id, i) => { const el = $(id); if (el) draft["npac"[i]] = el.value; }); }
window.openCart = function () {
  keepDraft(); trackId = null;
  const s = sub(), f = fee(), needMore = mode === "delivery" && zone === "city" && s < D.city.freeFrom;
  const unavailable = Object.keys(cart).some((k) => !avail(k));
  let hint = "";
  if (mode === "delivery" && zone === "city") hint = needMore ? `<div class="hint">${t("needMore")(D.city.freeFrom - s)}</div>` : `<div class="hint ok">${t("freeOk")}</div>`;
  if (mode === "delivery" && zone === "other") hint = `<div class="hint">${t("otherFee")}</div>`;
  if (mode === "pickup") hint = `<div class="hint ok">📍 ${t("pickAddr")}</div>`;
  const totalTxt = feeOpen() ? `${t("from")} ${s + f} ${t("cur")}` : `${s + f} ${t("cur")}`;
  const block = !canOrder() || unavailable || sending;
  $("sheet").innerHTML = `<h2>${t("yours")} <button class="x" onclick="closeAll()">×</button></h2>${lines()}${cartSauces()}
  <div class="sumrow"><span>${t("subtotal")}</span><span>${s} ${t("cur")}</span></div>
  ${mode === "delivery" ? `<div class="sumrow"><span>${t("feeLbl")}</span><span>${feeOpen() ? (f ? t("from") + " " + f + " " + t("cur") : t("byOp")) : (f ? f + " " + t("cur") : t("free"))}</span></div>` : ""}
  <div class="tot"><span>${t("total")}</span><span>${totalTxt}</span></div>
  <div class="seg"><button id="m1" class="${mode === "delivery" ? "on" : ""}" onclick="setMode('delivery')">${t("deliv")}</button><button id="m2" class="${mode === "pickup" ? "on" : ""}" onclick="setMode('pickup')">${t("pick")}</button></div>
  ${mode === "delivery" ? `<label>${t("zone")}</label><div class="seg"><button class="${zone === "city" ? "on" : ""}" onclick="setZone('city')">${t("zCity")}</button><button class="${zone === "other" ? "on" : ""}" onclick="setZone('other')">${t("zOther")}</button></div>` : ""}
  ${hint}
  <label>${t("payL")}</label><div class="seg">${payOpts().map((k) => `<button class="${pay === k ? "on" : ""}" onclick="setPay('${k}')">${t("pays")[k]}</button>`).join("")}</div>
  <label>${t("name")}</label><input id="fn" autocomplete="name" maxlength="60" placeholder="${t("nameP")}" value="${esc(draft.n)}">
  <label>${t("phone")}</label><input id="fp" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="0xx xxx xxx" value="${esc(draft.p)}">
  ${mode === "delivery" ? `<label>${t("addr")}</label><input id="fa" autocomplete="street-address" maxlength="200" placeholder="${zone === "city" ? t("addrPC") : t("addrP")}" value="${esc(draft.a)}">` : ""}
  <label>${t("com")}</label><textarea id="fc" rows="2" maxlength="300" placeholder="${t("comP")}">${esc(draft.c)}</textarea>
  <div class="hpf" aria-hidden="true"><label for="fw">Company</label><input id="fw" name="company" type="text" tabindex="-1" autocomplete="off"></div>
  ${!canOrder() ? `<div class="hint">${settings.open ? t("closedNow") : t("paused")}<a href="tel:${tel}" style="color:inherit;font-weight:800">${R.phone}</a></div>` : ""}
  <div class="err" id="err"></div>
  <button class="big" id="sendBtn" onclick="send()" ${block ? "disabled" : ""}>${sending ? t("sending") : `${t("send")} · ${totalTxt}`}</button>
  <div class="mini">${t("questions")}<a href="tel:${tel}">${R.phone}</a></div>`;
  if (!formAt && $("fn")) formAt = Date.now();
  $("ov").classList.add("show"); document.body.classList.add("lock");
};
const payOpts = () => mode === "delivery" ? ["cash", "mia"] : ["cash", "card"];
const rerender = () => { const sh = $("sheet"), y = sh.scrollTop; openCart(); sh.scrollTop = y; };
window.setMode = (m) => {
  mode = m; if (!payOpts().includes(pay)) pay = "cash"; rerender();
  // прокрутить к блоку с доставкой/самовывозом и полями заказа
  const sh = $("sheet"), el = $("m1");
  if (el) sh.scrollTo({ top: sh.scrollTop + el.getBoundingClientRect().top - sh.getBoundingClientRect().top - 12, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
};
window.setPay = (k) => { pay = k; rerender(); };
window.setZone = (z) => { zone = z; rerender(); };
window.closeAll = function () { keepDraft(); trackId = null; $("ov").classList.remove("show"); document.body.classList.remove("lock"); };
const phoneOk = (p) => !!S.normPhone(p);
let formAt = 0; // когда форма впервые показана — бот отправляет мгновенно
window.send = async function () {
  if (sending) return;
  const n = $("fn").value.trim(), p = $("fp").value.trim(), a = mode === "delivery" ? $("fa").value.trim() : "", c = $("fc").value.trim(), er = $("err");
  if (!n || !p || (mode === "delivery" && !a)) { er.textContent = mode === "delivery" ? t("errA") : t("errB"); er.style.display = "block"; return; }
  if (!phoneOk(p)) { er.textContent = t("errPh"); er.style.display = "block"; return; }
  const callMe = (k) => { er.innerHTML = `${t(k)}<a href="tel:${tel}" style="color:inherit;font-weight:800">${R.phone}</a>`; er.style.display = "block"; };
  // ловушка для ботов: скрытое поле заполнено или форма отправлена быстрее 3 секунд
  if (($("fw") && $("fw").value) || Date.now() - formAt < 3000) { callMe("errNet"); return; }
  keepDraft(); sending = true; $("sendBtn").disabled = true; $("sendBtn").textContent = t("sending");
  const items = Object.entries(cart).map(([k, q]) => ({ id: k, n: BY[k].name, q, p: BY[k].price }));
  const s = sub(), f = fee();
  try {
    const r = await Promise.race([
      S.createOrder({ items, subtotal: s, deliveryFee: f, total: s + f, mode: mode === "delivery" ? "delivery" : "pickup", zone: mode === "delivery" ? zone : "", name: n, phone: p, addr: a, comment: c, pay: payOpts().includes(pay) ? pay : "cash", lang: L }),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 15000)),
    ]);
    cart = {}; saveCart(); sending = false; upd();
    lastId = r.id; try { localStorage.setItem("lg-last", JSON.stringify({ id: r.id, num: r.num, mode, at: Date.now() })); } catch (e) {}
    try { localStorage.setItem("lg-me", JSON.stringify({ n, p, a })); } catch (e) {}
    openTrack(r.id, r.num);
  } catch (e) {
    sending = false; $("sendBtn").disabled = false; $("sendBtn").textContent = t("send");
    const code = e && e.code;
    if (code === "phone") { er.textContent = t("errPh"); er.style.display = "block"; }
    else callMe(code === "limit" ? "errLim" : code === "blocked" ? "errBlk" : "errNet");
  }
};

/* ---------- статус заказа ---------- */
let trackId = null, trackOff = null, lastId = null, lastOrder = null;
function steps(o) {
  const pick = o.mode === "pickup";
  const seq = pick ? ["new", "accepted", "cooking", "done"] : ["new", "accepted", "cooking", "delivery", "done"];
  const label = (s) => s === "done" ? (pick ? t("st").doneP : t("st").done) : s === "cooking" && pick && o.status === "cooking" ? t("st").cooking : t("st")[s];
  const icons = { new: "📨", accepted: "✓", cooking: "🍳", delivery: "🛵", done: "🎉" };
  const idx = seq.indexOf(o.status);
  return `<div class="track">${seq.map((s, i) => `<div class="st ${i <= idx ? "on" : ""} ${i === idx && s !== "done" ? "cur" : ""}"><i>${icons[s]}</i><b>${label(s)}</b></div>`).join("")}</div>`;
}
window.openTrack = function (id, num) {
  if (!id) return;
  trackId = id; if (trackOff) trackOff();
  const draw = (o) => {
    if (trackId !== id) return;
    lastOrder = o; updLast();
    if (!o) { $("sheet").innerHTML = `<div class="ok"><div class="em">✅</div><h3>${t("thanks")}!</h3><p>${t("got")(num || "")}</p><p class="mini">${t("callSoon")}</p><button class="big" onclick="closeAll()">${t("close")}</button></div>`; return; }
    $("sheet").innerHTML = `<div class="ok"><div class="em">${o.status === "cancelled" ? "⚠️" : "✅"}</div><h3>${t("thanks")}, ${esc(o.name)}!</h3><p>${t("got")(o.num)}</p>
    ${o.status === "cancelled" ? `<div class="cancelled">${t("cancelled")}<a href="tel:${tel}" style="color:inherit;font-weight:800">${R.phone}</a></div>` : steps(o)}
    ${o.status === "new" ? `<p class="mini">${t("callSoon")}</p>` : ""}
    <div class="mini" style="text-align:left">${(o.items || []).map((i) => `${i.q} × ${esc(i.n)}`).join("<br>")}<br><b style="color:var(--ink)">${t("total")}: ${o.zone === "other" ? t("from") + " " : ""}${o.total} ${t("cur")}${o.zone === "city" && o.subtotal < D.city.freeFrom && D.city.feeBelow == null ? " + " + t("feeLbl").toLowerCase() : ""}</b></div>
    <div class="mini">${t("questions")}<a href="tel:${tel}">${R.phone}</a></div>
    <button class="big" onclick="closeAll()">${t("close")}</button></div>`;
  };
  trackOff = S.watchOrder(id, draw);
  $("ov").classList.add("show"); document.body.classList.add("lock");
};
function updLast() {
  const b = $("lastord"), o = lastOrder;
  const show = o && !["done", "cancelled"].includes(o.status) && !$("ov").classList.contains("show");
  b.classList.toggle("show", !!show);
  b.style.bottom = count() ? "" : "calc(14px + env(safe-area-inset-bottom))";
  if (show) b.textContent = t("lastO")(o.num, o.status === "done" ? "" : (o.mode === "pickup" && o.status === "cooking" ? t("st").cooking : t("st")[o.status]));
}
// восстановить последний заказ (до 12 часов)
try {
  const l = JSON.parse(localStorage.getItem("lg-last") || "null");
  if (l && Date.now() - l.at < 12 * 3600e3) { lastId = l.id; S.watchOrder(l.id, (o) => { lastOrder = o; updLast(); }); }
  const me = JSON.parse(localStorage.getItem("lg-me") || "null"); if (me) draft = { n: me.n || "", p: me.p || "", a: me.a || "", c: "" };
} catch (e) {}

/* ---------- motion: бегущая строка ---------- */
function fillTicker() {
  const names = ["double-cheeseburger-lgusto", "sushi-philadelphia", "kebab-lgusto", "aripi-crispy", "sushi-golden-dragon", "crispy-burger", "fries", "sushi-set-lgusto", "chicken-nuggets", "big-double-cheeseburger"].map((id) => BY[id]).filter(Boolean);
  const one = names.map((m) => `<span class="ti">${m.img ? `<img src="${BASE}${m.img}" alt="" width="46" height="34">` : ""}${esc(m.name)}<b>${m.price} ${t("cur")}</b></span>`).join("");
  $("ticker").innerHTML = one + one;
}
/* ---------- старт ---------- */
$("callBtn").href = "tel:" + tel;
$("lastord").onclick = () => openTrack(lastId);
const soc = [["instagram", "Instagram"], ["facebook", "Facebook"], ["tiktok", "TikTok"]].filter(([k]) => R[k]);
$("soc").innerHTML = soc.map(([k, n]) => `<a href="${esc(R[k])}" target="_blank" rel="noopener"><span>${n}</span></a>`).join("");
S.watchSettings((s) => { settings = s; render(); extras(); filter(); updClosed(); if ($("ov").classList.contains("show") && !trackId && count()) openCart(); });
setInterval(updClosed, 60000);
setLang(L); fixSticky();
if ("serviceWorker" in navigator) navigator.serviceWorker.register(BASE + "sw.js").catch(() => {});
</script>
</body>
</html>
