<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<meta name="robots" content="noindex">
<title>L'Gusto — Operator</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e0e;--card:#181818;--line:#2a2a2a;--or:#ff6a1a;--tx:#f3f3f3;--mu:#9a9a9a;--gr:#2e9e4f;--rd:#e5484d;--bl:#3b82f6;--yl:#f5b400}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:Montserrat,system-ui,sans-serif;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center}
.lbox img{height:64px;margin-bottom:8px}
.lbox h1{font-size:18px;margin-bottom:18px;color:var(--mu);font-weight:600}
.lbox input{width:100%;background:#111;border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--tx);font:16px Montserrat;margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:800;font-size:15px;color:#111;background:var(--or)}
.btn.w{width:100%}
.lerr{color:var(--rd);font-size:13px;min-height:18px;margin:4px 0 8px}
.test{font-size:12px;color:var(--yl);margin-top:12px}
/* top */
header{position:sticky;top:0;z-index:10;background:rgba(14,14,14,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px calc(10px) ;padding-top:calc(10px + env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:10px}
.top img{height:38px}
.sp{flex:1}
.ib{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;height:42px;min-width:42px;padding:0 12px;font-weight:700;font-size:14px}
.open{display:flex;align-items:center;gap:8px;border-radius:12px;padding:0 12px;height:42px;font-weight:800;font-size:13px;border:0;color:#fff}
.open.on{background:var(--gr)}.open.off{background:var(--rd)}
.stats{display:flex;gap:8px;margin-top:10px}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stats b{display:block;font-size:18px}.stats span{font-size:11px;color:var(--mu)}
.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.tab{flex:1;white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 8px;font-weight:700;font-size:14px}
.tab.on{background:var(--or);border-color:var(--or);color:#111}
.cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:#111;color:var(--tx);font-size:12px;margin-left:6px;padding:0 6px}
.tab.on .cnt{background:#111;color:var(--or)}
.warn{margin-top:10px;background:#3a2a00;border:1px solid var(--yl);color:var(--yl);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center}
.warn button{margin-left:auto}
/* list */
main{padding:12px 14px;max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:60px 20px;font-size:15px}
.o{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative}
.o.new{border-color:var(--or);box-shadow:0 0 0 1px var(--or),0 0 24px rgba(255,106,26,.25);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px var(--or),0 0 6px rgba(255,106,26,.1)}}
.oh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.num{font-size:22px;font-weight:800}
.badge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;text-transform:uppercase;letter-spacing:.3px}
.b-new{background:var(--or);color:#111}.b-accepted{background:var(--bl);color:#fff}.b-cooking{background:var(--yl);color:#111}
.b-delivery{background:#8b5cf6;color:#fff}.b-done{background:var(--gr);color:#fff}.b-cancelled{background:#444;color:#ddd}
.time{margin-left:auto;text-align:right;font-size:12px;color:var(--mu)}.time b{display:block;color:var(--tx);font-size:14px}
.cl{font-size:14px;line-height:1.6;border-top:1px solid var(--line);padding-top:10px}
.cl a{color:var(--or);font-weight:700;text-decoration:none}
.mode{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:#222;margin-bottom:4px}
.its{margin:10px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:8px 0}
.it{display:flex;gap:8px;font-size:14px;padding:3px 0}.it .q{font-weight:800;color:var(--or);min-width:28px}.it .p{margin-left:auto;color:var(--mu)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tags:empty{display:none}
.ctag{font-size:12.5px;font-weight:700;border-radius:8px;padding:3px 8px;background:#262626;color:#ddd}.ctag.nw{background:#123a5c;color:#bfe3ff}.ctag.ok{background:#173d22;color:#9be6ae}.ctag.bad{background:#4a1515;color:#ffb3b3}
.blkrow{text-align:right;margin-top:6px}.lnk{background:none;border:0;color:#9a9a9a;font-size:13px;text-decoration:underline;cursor:pointer;padding:4px}
.pay{display:inline-block;background:#12306e;color:#fff;border-radius:10px;padding:5px 10px;font-size:14px;font-weight:800;margin:8px 0 0}
.com{background:#2a2100;color:var(--yl);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:17px;margin:6px 0 2px}
.sub{font-size:12px;color:var(--mu);display:flex;justify-content:space-between}
.act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.act .btn{flex:1;min-width:120px;padding:14px 10px}
.btn.g{background:var(--gr);color:#fff}.btn.b{background:var(--bl);color:#fff}.btn.y{background:var(--yl)}.btn.v{background:#8b5cf6;color:#fff}
.btn.x{background:transparent;border:1px solid var(--line);color:var(--mu);flex:0 0 auto;min-width:0}
/* stop list */
.stop{grid-column:1/-1}
.stop h3{font-size:15px;color:var(--mu);margin:14px 0 8px}
.sl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.si{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.si img{width:46px;height:36px;object-fit:cover;border-radius:8px}
.si span{flex:1;font-size:14px;font-weight:600}
.si.off span{color:var(--mu);text-decoration:line-through}
.sw{width:50px;height:30px;border-radius:15px;background:var(--gr);border:0;position:relative;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:23px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw.off{background:#444}.sw.off:after{left:3px}
.star{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#111;color:var(--mu);font-size:22px;line-height:1}
.star.on{background:var(--yl);border-color:var(--yl);color:#111}
.rn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--or);color:#111;display:grid;place-items:center;font-size:13px}
.si>span{min-width:0;overflow-wrap:anywhere;line-height:1.3}
.si img,.si>span:first-child{flex:none}
.rl{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.rbs{display:flex;gap:6px;flex:none;margin-left:auto}
.rb{width:38px;height:38px;min-width:0;padding:0;display:grid;place-items:center;font-size:16px}
.rb:disabled{opacity:.25}
.rb.x{color:#ff8a8a}
@media(max-width:520px){.rl{grid-template-columns:1fr}.rb{width:36px;height:36px}}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:50;padding:20px}
.md{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:360px;width:100%}
.md h3{margin-bottom:8px}.md p{color:var(--mu);font-size:14px;margin-bottom:16px}
.md .act .btn{min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-size:14px;z-index:60}
@media(max-width:520px){main{grid-template-columns:1fr;padding:10px}.stats b{font-size:16px}.top img{height:32px}.ib{padding:0 10px}}
</style>
</head>
<body>

<section id="login">
  <form class="lbox" id="lform">
    <img src="../img/logo-new.webp" alt="L'Gusto">
    <h1 data-t="opTitle"></h1>
    <input id="em" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="lerr" id="lerr"></div>
    <button class="btn w" data-t="enter"></button>
    <div class="test hide" id="testnote" data-t="testMode"></div>
  </form>
</section>

<section id="app" class="hide">
  <header>
    <div class="top">
      <img src="../img/logo-new.webp" alt="L'Gusto">
      <div class="sp"></div>
      <button class="open on" id="openBtn"></button>
      <button class="ib" id="langBtn">RO</button>
      <button class="ib" id="outBtn" title="Exit">⏻</button>
    </div>
    <div class="warn hide" id="soundWarn"><span data-t="soundOff"></span><button class="btn" id="soundBtn" data-t="soundOn"></button></div>
    <div class="warn hide" id="errWarn"></div>
    <div class="stats">
      <div><b id="stN">0</b><span data-t="ordersToday"></span></div>
      <div><b id="stS">0</b><span data-t="revToday"></span></div>
      <div><b id="stA">0</b><span data-t="avgCheck"></span></div>
    </div>
    <div class="tabs" id="tabs"></div>
  </header>
  <main id="list"></main>
</section>

<script src="../js/config.js"></script>
<script type="module">
import * as S from "../js/store.js";

const T = {
 ru:{opTitle:"Приложение оператора",enter:"Войти",email:"Логин",pass:"Пароль",badLogin:"Неверный логин или пароль",
  testMode:"Тестовый режим: Firebase не подключён, заказы видны только в этом браузере. Войти можно с любыми данными.",
  open:"Принимаем заказы",closed:"Приём закрыт",soundOff:"Звук выключен — нажмите, чтобы слышать новые заказы",soundOn:"Включить звук",
  ordersToday:"заказов сегодня",revToday:"лей сегодня",avgCheck:"средний чек",
  t_new:"Новые",t_work:"В работе",t_done:"Готовые",t_stop:"Стоп-лист",t_rec:"⭐ Рекомендуем",recHint:"Эти блюда показываются на сайте в блоке «Рекомендуем», в этом порядке. Лучше 4–8 блюд. Нажмите ☆ у блюда, чтобы добавить или убрать.",recNow:"Сейчас на сайте",recAll:"Все блюда",recEmpty:"Блок «Рекомендуем» скрыт — выберите блюда ниже.",recReset:"Вернуть как было",recUp:"Выше",recDown:"Ниже",recDel:"Убрать",recSaved:"Сохранено — на сайте обновится сразу",
  s_new:"Новый",s_accepted:"Принят",s_cooking:"Готовится",s_delivery:"В пути",s_done:"Выполнен",s_cancelled:"Отменён",
  delivery:"🛵 Доставка",pickup:"🏃 Самовывоз",min:"мин назад",now:"только что",
  a_accept:"✓ Принять",a_cook:"🍳 Готовится",a_deliv:"🛵 Отправить",a_ready:"✓ Выдан",a_done:"✓ Доставлен",a_cancel:"Отменить",
  cancelQ:"Отменить заказ #{n}?",cancelP:"Позвоните клиенту и предупредите об отмене.",yes:"Да, отменить",no:"Нет",
  closeQ:"Остановить приём заказов?",closeP:"Клиенты увидят на сайте, что заказы временно не принимаются.",stopBtn:"Остановить",
  emptyNew:"Новых заказов нет. Когда клиент оформит заказ, он появится здесь со звуком.",emptyWork:"Нет заказов в работе",emptyDone:"Сегодня ещё нет выполненных заказов",
  stopHint:"Выключите блюдо, если оно закончилось — клиенты не смогут его заказать.",subtotal:"Блюда",fee:"Доставка",total:"Итого",
  otherZone:"Другой населённый пункт",cNew:"🆕 Новый клиент",cRep:"✅ Уже заказывал: {n}",cCan:"⚠️ Отменено раньше: {n}",cBlk:"🚫 Номер заблокирован",a_block:"🚫 Заблокировать",a_unblock:"Разблокировать",blockQ:"Заблокировать {p}?",blockP:"С этого номера больше нельзя будет заказать на сайте. Если заказ новый, он будет отменён.",blkTitle:"🚫 Заблокированные номера",blkEmpty:"Заблокированных номеров нет. Заблокировать номер можно в карточке заказа.",blkDone:"Номер заблокирован",unblkDone:"Номер разблокирован",pays:{cash:"💵 Наличные",mia:"📱 Оплата MIA",card:"💳 Оплата картой"},feeSmall:"Заказ меньше 400 лей: доставка платная — назовите клиенту стоимость доставки.",feeConfirm:"Доставка в другой населённый пункт: уточните у курьера стоимость доставки (от 50 лей), сообщите её клиенту и прибавьте к итогу.",from:"от",errPerm:"Нет доступа к заказам. Проверьте, что ваш email добавлен в правила Firestore.",lei:"лей",newOrder:"Новый заказ"},
 ro:{opTitle:"Aplicația operatorului",enter:"Intră",email:"Login",pass:"Parola",badLogin:"Login sau parolă greșită",
  testMode:"Mod de test: Firebase nu e conectat, comenzile se văd doar în acest browser. Puteți intra cu orice date.",
  open:"Primim comenzi",closed:"Comenzi oprite",soundOff:"Sunetul e oprit — apăsați ca să auziți comenzile noi",soundOn:"Pornește sunetul",
  ordersToday:"comenzi azi",revToday:"lei azi",avgCheck:"bon mediu",
  t_new:"Noi",t_work:"În lucru",t_done:"Finalizate",t_stop:"Stop-listă",t_rec:"⭐ Recomandăm",recHint:"Aceste preparate apar pe site în blocul «Recomandăm», în această ordine. Ideal 4–8 preparate. Apăsați ☆ ca să adăugați sau să scoateți.",recNow:"Acum pe site",recAll:"Toate preparatele",recEmpty:"Blocul «Recomandăm» e ascuns — alegeți preparate mai jos.",recReset:"Revino la implicit",recUp:"Mai sus",recDown:"Mai jos",recDel:"Scoate",recSaved:"Salvat — pe site se actualizează imediat",
  s_new:"Nouă",s_accepted:"Acceptată",s_cooking:"Se gătește",s_delivery:"În livrare",s_done:"Finalizată",s_cancelled:"Anulată",
  delivery:"🛵 Livrare",pickup:"🏃 Ridicare",min:"min în urmă",now:"chiar acum",
  a_accept:"✓ Acceptă",a_cook:"🍳 Se gătește",a_deliv:"🛵 Trimite",a_ready:"✓ Ridicată",a_done:"✓ Livrată",a_cancel:"Anulează",
  cancelQ:"Anulați comanda #{n}?",cancelP:"Sunați clientul și anunțați-l despre anulare.",yes:"Da, anulează",no:"Nu",
  closeQ:"Opriți primirea comenzilor?",closeP:"Clienții vor vedea pe site că momentan nu se primesc comenzi.",stopBtn:"Oprește",
  emptyNew:"Nu sunt comenzi noi. Când un client comandă, comanda apare aici cu sunet.",emptyWork:"Nu sunt comenzi în lucru",emptyDone:"Azi încă nu sunt comenzi finalizate",
  stopHint:"Opriți preparatul dacă s-a terminat — clienții nu-l vor putea comanda.",subtotal:"Preparate",fee:"Livrare",total:"Total",
  otherZone:"Altă localitate",cNew:"🆕 Client nou",cRep:"✅ A mai comandat: {n}",cCan:"⚠️ Anulate anterior: {n}",cBlk:"🚫 Număr blocat",a_block:"🚫 Blochează",a_unblock:"Deblochează",blockQ:"Blocați {p}?",blockP:"De pe acest număr nu se va mai putea comanda pe site. Dacă comanda e nouă, va fi anulată.",blkTitle:"🚫 Numere blocate",blkEmpty:"Nu sunt numere blocate. Puteți bloca un număr din cardul comenzii.",blkDone:"Număr blocat",unblkDone:"Număr deblocat",pays:{cash:"💵 Numerar",mia:"📱 Plată MIA",card:"💳 Plată cu cardul"},feeSmall:"Comandă sub 400 lei: livrarea e cu plată — spuneți clientului costul livrării.",feeConfirm:"Livrare în altă localitate: aflați de la curier costul livrării (de la 50 lei), comunicați-l clientului și adăugați-l la total.",from:"de la",errPerm:"Nu aveți acces la comenzi. Verificați dacă email-ul e adăugat în regulile Firestore.",lei:"lei",newOrder:"Comandă nouă"}
};
let L = "ru"; try { L = localStorage.getItem("lg-op-lang") || "ru"; } catch (e) {}
const t = (k) => T[L][k] || k;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MENU = window.MENU || [];

let orders = [], settings = { open: true, stop: [] }, tab = "new", unsub = [], seen = new Set(), firstLoad = true;

function applyLang() {
  document.documentElement.lang = L;
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
  $("em").placeholder = t("email"); $("pw").placeholder = t("pass");
  $("langBtn").textContent = L === "ru" ? "RO" : "RU";
  renderAll();
}

/* ---------- звук ---------- */
let actx = null, soundOk = false;
function unlockSound() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); soundOk = true; } catch (e) {}
  $("soundWarn").classList.toggle("hide", soundOk);
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
}
function beep() {
  if (!actx || actx.state !== "running") { $("soundWarn").classList.remove("hide"); return; }
  const now = actx.currentTime;
  [0, 0.18, 0.36].forEach((d, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = [880, 1175, 1568][i];
    g.gain.setValueAtTime(0.0001, now + d); g.gain.exponentialRampToValueAtTime(0.5, now + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + d + 0.16);
    o.connect(g).connect(actx.destination); o.start(now + d); o.stop(now + d + 0.18);
  });
  if (navigator.vibrate) try { navigator.vibrate([200, 100, 200]); } catch (e) {}
}
setInterval(() => { if (orders.some((o) => o.status === "new")) beep(); }, 6000);
$("soundBtn").onclick = unlockSound;
document.addEventListener("pointerdown", () => { if (!soundOk) unlockSound(); }, { once: false });

function notify(o) {
  beep();
  try { if ("Notification" in window && Notification.permission === "granted" && document.hidden) new Notification(`${t("newOrder")} #${o.num}`, { body: `${o.total} ${t("lei")} · ${o.name}`, icon: "../icons/icon-192.png" }); } catch (e) {}
}
let titleFlash = null;
function updateTitle() {
  const n = orders.filter((o) => o.status === "new").length;
  clearInterval(titleFlash);
  if (n) { let f = 0; titleFlash = setInterval(() => (document.title = (f ^= 1) ? `🔔 (${n}) ${t("newOrder")}` : "L'Gusto — Operator"), 1000); }
  else document.title = "L'Gusto — Operator";
}

/* ---------- вход ---------- */
if (!S.LIVE) $("testnote").classList.remove("hide");
$("lform").onsubmit = async (e) => {
  e.preventDefault(); $("lerr").textContent = ""; unlockSound();
  try { await S.login($("em").value.trim(), $("pw").value); } catch (err) { $("lerr").textContent = t("badLogin"); }
};
$("outBtn").onclick = () => S.logout();
$("langBtn").onclick = () => { L = L === "ru" ? "ro" : "ru"; try { localStorage.setItem("lg-op-lang", L); } catch (e) {} applyLang(); };

S.onAuth((u) => {
  unsub.forEach((f) => f()); unsub = [];
  $("login").classList.toggle("hide", !!u); $("app").classList.toggle("hide", !u);
  if (!u) return;
  firstLoad = true; seen = new Set();
  const since = Date.now() - 24 * 3600 * 1000;
  unsub.push(S.watchOrders(since, (list) => {
    $("errWarn").classList.add("hide");
    list.forEach((o) => { if (!seen.has(o.id)) { seen.add(o.id); if (!firstLoad && o.status === "new") notify(o); } });
    firstLoad = false; orders = list; renderAll(); updateTitle();
  }, (e) => { $("errWarn").textContent = t("errPerm"); $("errWarn").classList.remove("hide"); }));
  unsub.push(S.watchSettings((s) => { settings = s; renderAll(); }));
  unsub.push(S.watchBlocked((b) => { blocked = b; renderAll(); }));
  $("soundWarn").classList.toggle("hide", soundOk);
});

/* ---------- отрисовка ---------- */
const GROUP = { new: ["new"], work: ["accepted", "cooking", "delivery"], done: ["done", "cancelled"] };
function renderAll() {
  if ($("app").classList.contains("hide")) return;
  const ob = $("openBtn"); ob.className = "open " + (settings.open ? "on" : "off"); ob.textContent = settings.open ? "● " + t("open") : "■ " + t("closed");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const tod = orders.filter((o) => o.createdAt >= today.getTime() && o.status !== "cancelled");
  const sum = tod.reduce((s, o) => s + (o.total || 0), 0);
  $("stN").textContent = tod.length; $("stS").textContent = sum; $("stA").textContent = tod.length ? Math.round(sum / tod.length) : 0;
  const c = (g) => orders.filter((o) => GROUP[g].includes(o.status)).length;
  $("tabs").innerHTML = ["new", "work", "done", "stop", "rec"].map((k) =>
    `<button class="tab${tab === k ? " on" : ""}" data-tab="${k}">${t("t_" + k)}${k !== "stop" && k !== "rec" ? `<span class="cnt">${k === "done" ? orders.filter((o) => o.status === "done" && o.createdAt >= today.getTime()).length : c(k)}</span>` : ""}</button>`).join("");
  if (tab === "stop") return renderStop();
  if (tab === "rec") return renderRec();
  const list = orders.filter((o) => GROUP[tab].includes(o.status));
  if (tab !== "new") list.sort((a, b) => (tab === "work" ? a.createdAt - b.createdAt : b.updatedAt - a.updatedAt));
  else list.sort((a, b) => a.createdAt - b.createdAt);
  $("list").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">${t(tab === "new" ? "emptyNew" : tab === "work" ? "emptyWork" : "emptyDone")}</div>`;
}
function ago(ms) { const m = Math.floor((Date.now() - ms) / 60000); return m < 1 ? t("now") : `${m} ${t("min")}`; }
function hm(ms) { return new Date(ms).toLocaleTimeString("ro-MD", { hour: "2-digit", minute: "2-digit" }); }
let blocked = [];
const pstats = {}; // телефон → {total, cancelled} (история клиента)
const isBlocked = (ph) => blocked.some((b) => b.phone === ph);
function clientTag(o) {
  if (isBlocked(o.phone)) return `<span class="ctag bad">${t("cBlk")}</span>`;
  const st = pstats[o.phone];
  if (st === undefined) { pstats[o.phone] = null; S.phoneStats(o.phone).then((r) => { pstats[o.phone] = r; renderAll(); }).catch(() => {}); return ""; }
  if (!st) return "";
  const prev = Math.max(0, st.total - 1), tags = [];
  tags.push(prev ? `<span class="ctag ok">${t("cRep").replace("{n}", prev)}</span>` : `<span class="ctag nw">${t("cNew")}</span>`);
  if (st.cancelled) tags.push(`<span class="ctag bad">${t("cCan").replace("{n}", st.cancelled)}</span>`);
  return tags.join("");
}
function card(o) {
  const acts = [];
  if (o.status === "new") acts.push(["accepted", "g", "a_accept"]);
  if (o.status === "accepted") acts.push(["cooking", "y", "a_cook"]);
  if (o.status === "cooking") acts.push(o.mode === "delivery" ? ["delivery", "v", "a_deliv"] : ["done", "g", "a_ready"]);
  if (o.status === "delivery") acts.push(["done", "g", "a_done"]);
  const canCancel = ["new", "accepted", "cooking", "delivery"].includes(o.status);
  const tel = String(o.phone || "").replace(/[^\d+]/g, "");
  return `<div class="o ${o.status === "new" ? "new" : ""}">
   <div class="oh"><span class="num">#${o.num}</span><span class="badge b-${o.status}">${t("s_" + o.status)}</span>
    <div class="time"><b>${hm(o.createdAt)}</b>${ago(o.createdAt)}</div></div>
   <div class="cl"><span class="mode">${t(o.mode)}</span><br>👤 ${esc(o.name)} · <span class="mode" style="padding:1px 6px">${(o.lang || "ro").toUpperCase()}</span><br>
    📞 <a href="tel:${esc(tel)}">${esc(o.phone)}</a>${o.mode === "delivery" ? `<br>📍 ${o.zone === "other" ? `<b style="color:var(--yl)">${esc(o.loc || t("otherZone"))}</b> · ` : ""}${esc(o.addr)}` : ""}</div>
   <div class="tags">${clientTag(o)}</div>
   <div class="pay">${t("pays")[o.pay || "cash"] || o.pay}</div>
   ${o.comment ? `<div class="com">💬 ${esc(o.comment)}</div>` : ""}
   <div class="its">${(o.items || []).map((i) => `<div class="it"><span class="q">${i.q}×</span><span>${esc(i.n)}</span><span class="p">${i.p * i.q}</span></div>`).join("")}</div>
   ${o.zone === "other" && !o.deliveryFee ? `<div class="com">⚠️ ${t("feeConfirm")}</div>` : ""}${o.mode === "delivery" && o.zone === "city" && o.subtotal < ((window.RESTAURANT.delivery.city||{}).freeFrom||0) && !o.deliveryFee ? `<div class="com">⚠️ ${t("feeSmall")}</div>` : ""}${o.deliveryFee ? `<div class="sub"><span>${t("subtotal")}</span><span>${o.subtotal} ${t("lei")}</span></div><div class="sub"><span>${t("fee")}${o.zone === "other" && !o.loc ? " (" + t("from") + ")" : ""}</span><span>${o.deliveryFee} ${t("lei")}</span></div>` : ""}
   <div class="tot"><span>${t("total")}</span><span>${o.total} ${t("lei")}${o.zone === "other" && !o.deliveryFee ? ` <small style="font-size:.6em;opacity:.8">+ ${t("fee").toLowerCase()}</small>` : ""}</span></div>
   ${acts.length || canCancel ? `<div class="act">${acts.map(([s, c, k]) => `<button class="btn ${c}" data-id="${o.id}" data-s="${s}">${t(k)}</button>`).join("")}${canCancel ? `<button class="btn x" data-id="${o.id}" data-cancel="${o.num}">${t("a_cancel")}</button>` : ""}</div>` : ""}
   ${isBlocked(o.phone) ? "" : `<div class="blkrow"><button class="lnk" data-block="${esc(o.phone)}" data-bname="${esc(o.name)}" data-bid="${o.id}" data-bst="${o.status}">${t("a_block")}</button></div>`}
  </div>`;
}
const recList = () => (Array.isArray(settings.rec) ? settings.rec : (window.RECOMMENDED_DEFAULT || [])).filter((id) => MENU.some((m) => m.id === id));
function setRec(list) { S.setSettings({ rec: list }).then(() => toast(t("recSaved"))).catch((e) => toast("Error: " + e.message)); }
function renderRec() {
  const rec = recList(), by = Object.fromEntries(MENU.map((m) => [m.id, m]));
  const pic = (m, c) => m.img ? `<img src="../${m.img}" alt="" style="object-fit:contain;background:#222">` : `<span style="flex:0 0 46px;text-align:center;font-size:22px">${c ? c.icon : "🍽️"}</span>`;
  const cats = (window.CATEGORIES || []).filter((c) => !c.hidden);
  $("list").innerHTML = `<div class="stop"><p style="color:var(--mu);font-size:14px">${t("recHint")}</p>
   <h3>${t("recNow")} (${rec.length})</h3>
   ${rec.length ? `<div class="sl rl">${rec.map((id, i) => { const m = by[id]; return `<div class="si"><b class="rn">${i + 1}</b>${pic(m)}<span>${esc(m.name)}</span>
     <div class="rbs"><button class="ib rb" data-recmove="${id}" data-d="-1" ${i ? "" : "disabled"} title="${t("recUp")}">↑</button><button class="ib rb" data-recmove="${id}" data-d="1" ${i < rec.length - 1 ? "" : "disabled"} title="${t("recDown")}">↓</button><button class="ib rb x" data-rec="${id}" title="${t("recDel")}">✕</button></div></div>`; }).join("")}</div>` : `<p class="warn" style="margin:0">${t("recEmpty")}</p>`}
   <p style="margin:10px 0"><button class="ib" data-recreset="1">${t("recReset")}</button></p>
   <h3>${t("recAll")}</h3>
   ${cats.map((c) => `<h3 style="margin-top:6px">${c.icon} ${c[L] || c.ro}</h3><div class="sl">${MENU.filter((m) => m.cat === c.id).map((m) => { const on = rec.includes(m.id);
     return `<div class="si">${pic(m, c)}<span>${esc(m.name)}</span><button class="star${on ? " on" : ""}" data-rec="${m.id}" aria-pressed="${on}" aria-label="${esc(m.name)}">${on ? "★" : "☆"}</button></div>`; }).join("")}</div>`).join("")}</div>`;
}
function renderStop() {
  const off = new Set(settings.stop || []);
  const cats = window.CATEGORIES || [];
  const blk = `<h3>${t("blkTitle")}</h3>${blocked.length ? `<div class="sl">${blocked.map((b) => `<div class="si"><span>📞 ${esc(b.phone)}${b.name ? ` · ${esc(b.name)}` : ""}</span><button class="ib" data-unblock="${esc(b.phone)}">${t("a_unblock")}</button></div>`).join("")}</div>` : `<p style="color:var(--mu);font-size:14px">${t("blkEmpty")}</p>`}`;
  $("list").innerHTML = `<div class="stop">${blk}<p style="color:var(--mu);font-size:14px;margin-top:18px">${t("stopHint")}</p>${cats.map((c) => `<h3>${c.icon} ${c[L] || c.ro}</h3><div class="sl">${MENU.filter((m) => m.cat === c.id).map((m) =>
    `<div class="si ${off.has(m.id) ? "off" : ""}">${m.img ? `<img src="../${m.img}" alt="" style="object-fit:contain;background:#222">` : `<span style="flex:0 0 46px;text-align:center;font-size:22px">${c.icon}</span>`}<span>${esc(m.name)}</span><button class="sw ${off.has(m.id) ? "off" : ""}" data-stop="${m.id}" aria-label="${esc(m.name)}"></button></div>`).join("")}</div>`).join("")}</div>`;
}

/* ---------- действия ---------- */
function toast(msg) { const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2500); }
function confirmBox(title, text, okLabel, onOk) {
  const ov = document.createElement("div"); ov.className = "ov";
  ov.innerHTML = `<div class="md"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="act"><button class="btn x" data-no>${t("no")}</button><button class="btn" style="background:var(--rd);color:#fff" data-ok>${esc(okLabel)}</button></div></div>`;
  ov.onclick = (e) => { if (e.target === ov || e.target.dataset.no !== undefined) ov.remove(); if (e.target.dataset.ok !== undefined) { ov.remove(); onOk(); } };
  document.body.appendChild(ov);
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; renderAll(); scrollTo(0, 0); return; }
  if (b.dataset.s) { b.disabled = true; try { await S.setStatus(b.dataset.id, b.dataset.s); } catch (err) { toast("Error: " + err.message); b.disabled = false; } return; }
  if (b.dataset.cancel) { confirmBox(t("cancelQ").replace("{n}", b.dataset.cancel), t("cancelP"), t("yes"), () => S.setStatus(b.dataset.id, "cancelled")); return; }
  if (b.dataset.rec) { const r = recList(); const i = r.indexOf(b.dataset.rec); if (i > -1) r.splice(i, 1); else r.push(b.dataset.rec); setRec(r); return; }
  if (b.dataset.recmove) { const r = recList(); const i = r.indexOf(b.dataset.recmove), j = i + +b.dataset.d; if (i > -1 && j >= 0 && j < r.length) { [r[i], r[j]] = [r[j], r[i]]; setRec(r); } return; }
  if (b.dataset.recreset) { setRec(null); return; }
  if (b.dataset.block) { const d = b.dataset; confirmBox(t("blockQ").replace("{p}", d.block), t("blockP"), t("a_block"), async () => {
      try { await S.setBlocked(d.block, true, d.bname); if (d.bst === "new") await S.setStatus(d.bid, "cancelled"); toast(t("blkDone")); } catch (err) { toast("Error: " + err.message); } }); return; }
  if (b.dataset.unblock) { try { await S.setBlocked(b.dataset.unblock, false); toast(t("unblkDone")); } catch (err) { toast("Error: " + err.message); } return; }
  if (b.dataset.stop) { const s = new Set(settings.stop || []); s.has(b.dataset.stop) ? s.delete(b.dataset.stop) : s.add(b.dataset.stop); S.setSettings({ stop: [...s] }); return; }
  if (b.id === "openBtn") { if (settings.open) confirmBox(t("closeQ"), t("closeP"), t("stopBtn"), () => S.setSettings({ open: false })); else S.setSettings({ open: true }); }
});
setInterval(renderAll, 30000); // обновлять «N мин назад»
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
applyLang();
</script>
</body>
</html>
